<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Crop Details | Agro-web</title>
  </head>
  <body>
    <main>
      <!-- Header -->
      <header class="bg-[#328E6E] text-white">
        <nav class="container mx-auto py-5 px-4 flex justify-between items-center">
          <!-- Logo -->
          <a href="/" class="text-3xl font-bold">Agro-web</a>

          <!-- Desktop Nav -->
          <ul class="hidden md:flex items-center gap-8 font-medium">
            <li><a href="/" class="hover:text-gray-200">Home</a></li>
            <li><a href="/guide.html" class="hover:text-gray-200">Guide</a></li>
            <li><a href="/crops.html" class="hover:text-gray-200">Crops</a></li>
            <li><a href="/pest-control.html" class="hover:text-gray-200">Pest Control</a></li>
            <li><a href="/contact.html" class="hover:text-gray-200">Contact</a></li>
          </ul>

          <!-- Hamburger Button -->
          <button id="menu-toggle" class="md:hidden focus:outline-none">
            <svg
              class="w-6 h-6 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </nav>
      </header>

      <!-- Hero Section -->
      <section class="relative h-[70vh] flex items-center justify-center text-center text-white">
        <img
          src="./assests/crops.jpg"
          alt="Crop field background"
          class="absolute inset-0 w-full h-full object-cover opacity-70 z-[-1]"
        />
        <div class="bg-black/50 p-8 rounded shadow-md backdrop-blur-sm">
          <h1 class="text-5xl font-extrabold mb-4 text-green-600">
            Explore Crop Details
          </h1>
          <p class="text-lg max-w-2xl mx-auto">
            Discover essential information about crop varieties, sowing times,
            irrigation, pest management, and expected yields.
          </p>
        </div>
      </section>

      <!-- Search Section -->
      <section class="py-8 bg-gray-100">
        <div class="max-w-6xl mx-auto">
          <input
            type="text"
            id="search-input"
            class="w-full p-4 text-lg border rounded-lg"
            placeholder="Search for crops..."
            onkeyup="searchCrops()"
          />
        </div>
      </section>

      <!-- Crop List Section -->
      <section class="py-20 px-6 bg-white">
        <div class="max-w-6xl mx-auto">
          <div
            id="crop-list"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
          >
            <!-- Crop items will be added here dynamically -->
          </div>
          <!-- No results message -->
          <div
            id="no-results-message"
            class="text-center text-xl text-red-500 hidden"
          >
            No matching crops found.
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-[#328E6E] text-white py-4">
      <div class="container mx-auto text-center">
        <p>&copy; 2025 Agro-web. All rights reserved.</p>
      </div>
    </footer>

    <script>
      // Sample crop data with detailed information
      const cropData = [
        {
          name: "Rice",
          image:
            "https://i.unu.edu/media/ourworld.unu.edu-en/article/5379/SRI-hybrid-rice-field.jpg",
          varieties: ["Indica", "Japonica", "Hybrid"],
          sowingTime: "April to May",
          irrigation: "Flooded fields, 2-3 months",
          expectedYield: "4-6 tons per hectare",
          pestManagement: "Use of chemical pesticides, biological agents like fish, and proper water management."
        },
        {
          name: "Wheat",
          image:
            "https://5.imimg.com/data5/XB/JF/MY-38700875/wheat-bulk-supply.jpg",
          varieties: ["Hard Red Winter", "Soft Red Winter", "Durum"],
          sowingTime: "September to October",
          irrigation: "Minimal irrigation, rain-fed",
          expectedYield: "3-5 tons per hectare",
          pestManagement: "Use of fungicides, crop rotation, and resistant varieties."
        },
        {
          name: "Maize",
          image:
            "https://www.mccormick.it/wp-content/uploads/2020/05/dati-aggiornati-sulla-produzione-di-mais-nel-mondo.jpg",
          varieties: ["Yellow", "White", "Sweet Corn"],
          sowingTime: "April to May",
          irrigation: "Drip irrigation, 3-4 months",
          expectedYield: "7-10 tons per hectare",
          pestManagement: "Integrated pest management (IPM) using natural predators and resistant varieties."
        },
        {
          name: "Soybean",
          image:
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAV4aDDZhYH6o03M_bB8LO84Q8N9nMtv00Ag&s",
          varieties: ["Early Group", "Mid Group", "Late Group"],
          sowingTime: "April to May",
          irrigation: "Rain-fed or supplemental irrigation",
          expectedYield: "2-3 tons per hectare",
          pestManagement: "Biological control, chemical sprays, crop rotation."
        },
        // Add more crops with details...
      ];

      function renderCrops(crops) {
        const cropList = document.getElementById("crop-list");
        const noResultsMessage = document.getElementById("no-results-message");

        cropList.innerHTML = ""; // Clear previous crops

        if (crops.length === 0) {
          noResultsMessage.classList.remove("hidden"); // Show no results message
        } else {
          noResultsMessage.classList.add("hidden"); // Hide no results message
          crops.forEach((crop) => {
            const cropCard = document.createElement("div");
            cropCard.classList.add(
              "crop-item",
              "bg-gray-50",
              "p-6",
              "rounded-lg",
              "shadow",
              "hover:shadow-lg",
              "transition"
            );
            cropCard.innerHTML = `
              <img src="${crop.image}" class="rounded mb-4 w-full h-48 object-cover" alt="${crop.name}" />
              <h3 class="text-xl font-semibold text-[#328E6E] mb-2">${crop.name}</h3>
              <p class="text-gray-700">Learn how to cultivate ${crop.name} for optimal yield.</p>
              <div class="mt-4">
                <p><strong>Varieties:</strong> ${crop.varieties.join(", ")}</p>
                <p><strong>Sowing Time:</strong> ${crop.sowingTime}</p>
                <p><strong>Irrigation:</strong> ${crop.irrigation}</p>
                <p><strong>Expected Yield:</strong> ${crop.expectedYield}</p>
                <p><strong>Pest Management:</strong> ${crop.pestManagement}</p>
              </div>
            `;
            cropList.appendChild(cropCard);
          });
        }
      }

      // Initial render
      renderCrops(cropData);

      // Search functionality
      function searchCrops() {
        const searchInput = document
          .getElementById("search-input")
          .value.toLowerCase();
        const filteredCrops = cropData.filter((crop) =>
          crop.name.toLowerCase().includes(searchInput)
        );

        renderCrops(filteredCrops);
      }

      // Adding event listener for search bar
      document
        .getElementById("search-input")
        .addEventListener("keyup", searchCrops);
    </script>
  </body>
</html>
